en:
  - name: "Pocket"
    slug: "pocket"
    status: "shutdown"
    description: "Pocket has shut down. wallabag.it imports your Pocket export and keeps your articles."
  - name: "Omnivore"
    slug: "omnivore"
    status: "shutdown"
    description: "Omnivore has shut down. wallabag.it is open source too, and has been running since 2016."
  - name: "Matter"
    slug: "matter"
    status: "active"
    description: "Matter is made for the iPhone first. wallabag.it works on Android, iOS and e-readers."
  - name: "Instapaper"
    slug: "instapaper"
    status: "active"
    description: "Instapaper Premium costs around 55 € a year. wallabag.it costs 11 €."
  - name: "Readwise Reader"
    slug: "readwise"
    status: "active"
    description: "Readwise Reader costs around 96 € a year and is hosted in the US. wallabag.it costs 11 € and is hosted in Europe."
  - name: "Raindrop.io"
    slug: "raindrop"
    status: "active"
    description: "Raindrop.io organises links. wallabag.it saves the whole article so you can read it."
  - name: "Obsidian Web Clipper"
    slug: "obsidian-web-clipper"
    status: "active"
    description: "Obsidian Web Clipper turns pages into notes. wallabag.it is a reading list you can read everywhere."
  - name: "Readeck"
    slug: "readeck"
    status: "active"
    description: "Readeck is a good self-hosted app. wallabag.it is hosted for you, in Europe."
  - name: "Pinboard"
    slug: "pinboard"
    status: "active"
    description: "Pinboard keeps links, not articles. wallabag.it saves the whole article."
